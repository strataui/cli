[package]
name = "strata_cli"
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
description = "Universal Developer CLI, Scaffolding Engine, and Cross-Platform Packaging Toolchain for Strata"
repository = "https://github.com/strataui/cli"

[lib]
path = "src/lib.rs"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata = { git = "https://github.com/strataui/strata.git" }
strata_dom = { git = "https://github.com/strataui/strata.git" }
strata_codegen_js = { git = "https://github.com/strataui/strata.git" }
strata_mobile_test = { git = "https://github.com/strataui/strata.git" }
strata_sim = { git = "https://github.com/strataui/strata.git" }
strata_mcp = { git = "https://github.com/strataui/strata.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
ring = "0.17"
